name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Placeholder for the stylesheet (normally generated by dx)
        run: mkdir -p assets && touch assets/tailwind.css
      - name: Tests (exercise generators, server)
        run: cargo test --workspace
      - name: Web app compiles to WebAssembly
        run: cargo build --target wasm32-unknown-unknown -p nrzlearn
