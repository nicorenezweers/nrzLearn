[package]
name = "nrzlearn-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Self-hosted server for nrzLearn: accounts, progress, leaderboard and the web app."

[dependencies]
nrzlearn-shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
