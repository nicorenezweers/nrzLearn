[package]
name = "nrzlearn-server"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Small server for the nrzLearn web app: static files, anonymous learning statistics and an admin area."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query"] }
tokio = { version = "1", features = ["macros", "rt", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
brotli = "8"
nrzlearn-model = { path = "../model" }

